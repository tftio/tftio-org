[package]
name = "tftio-org"
version = "0.1.7"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Typed org-mode AST and parser"
readme = "README.md"
repository = "https://github.com/tftio/tftio-org"
homepage = "https://github.com/tftio/tftio-org"
keywords = ["org-mode", "parser", "ast", "emacs"]
categories = ["parser-implementations", "text-processing"]
# Not published to crates.io while the GitHub repository is the distribution
# channel. Revisit before re-enabling.
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
enum_glob_use = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lib]
name = "tftio_org"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
